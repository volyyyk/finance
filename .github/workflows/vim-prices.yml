name: VIM fund prices

# Официальная стоимость пая открытых ПИФ «Яндекс Пэй» (ВИМ) не приходит
# с биржи: скрипт снимает её со страницы wealthim.ru и кладёт в data/vim/.
# GitHub Pages публикует снимки вместе с сайтом — приложение читает их
# напрямую, без Cloudflare Worker.
on:
  schedule:
    # ~08:30 и ~17:30 МСК: ВИМ публикует стоимость пая по итогам дня
    - cron: '30 5 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update VIM price snapshots
        run: node scripts/update-vim-snapshots.cjs
      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- data/vim; then
            echo "Снимки не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vim
          git commit -m "Update VIM fund price snapshots"
          git push
