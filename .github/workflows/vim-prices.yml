name: Market snapshots

on:
  schedule:
    # ~08:35 и ~17:35 МСК: фонды ВИМ публикуют пай по итогам дня,
    # MOEX ISS отдаёт свечи и marketdata
    - cron: '35 5 * * *'
    - cron: '35 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update VIM price snapshots
        run: node scripts/update-vim-snapshots.cjs
        continue-on-error: true
      - name: Update MOEX quote snapshots
        run: node scripts/snapshot-moex-quotes.mjs
        continue-on-error: true
      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- data/vim data/moex-quotes.json; then
            echo "Снапшоты не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vim data/moex-quotes.json
          git commit -m "Update market snapshots"
          git push
